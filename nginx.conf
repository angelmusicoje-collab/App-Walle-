# Los archivos de /assets llevan un hash en el nombre: se pueden guardar un año.
# index.html, el service worker y el manifest nunca se guardan, para que las
# actualizaciones de la app lleguen al celular en cuanto se publican.
map $uri $wami_cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/icons/    "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # React Router: cualquier ruta que no sea un archivo (/pedidos/123) sirve la app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx no conoce la extensión .webmanifest; sin esto el celular puede no
    # ofrecer "Instalar app".
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    add_header Cache-Control $wami_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
